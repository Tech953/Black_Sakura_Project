openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ENGRAM AI Persona Framework API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: personality
    description: Personality trait operations
  - name: memory
    description: Memory layer operations
  - name: journal
    description: Reflective journal operations
  - name: personas
    description: Persona form operations
  - name: beliefs
    description: Belief registry operations
  - name: evolution
    description: Evolution log operations
  - name: initiative
    description: Initiative event operations
  - name: hiero
    description: Hiero-Code symbol operations
  - name: expressions
    description: Emotive QUERTY micro-expression library operations
  - name: stats
    description: System statistics and analytics
  - name: openai
    description: OpenAI AI chat operations
  - name: engrams
    description: Engram processing environment operations
  - name: media
    description: Multimodal media perception operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /personality:
    get:
      operationId: getPersonality
      tags: [personality]
      summary: Get personality traits
      description: Returns the current ENGRAM personality trait values
      responses:
        "200":
          description: Current personality traits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalityProfile"
    patch:
      operationId: updatePersonality
      tags: [personality]
      summary: Update personality traits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalityInput"
      responses:
        "200":
          description: Updated personality traits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalityProfile"

  /memories:
    get:
      operationId: listMemories
      tags: [memory]
      summary: List memory entries
      parameters:
        - name: layer
          in: query
          schema:
            type: string
            enum: [working, episodic, semantic, preference, reflective, procedural]
      responses:
        "200":
          description: List of memory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryEntry"
    post:
      operationId: createMemory
      tags: [memory]
      summary: Create a memory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created memory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"

  /memories/{id}:
    delete:
      operationId: deleteMemory
      tags: [memory]
      summary: Delete a memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Memory deleted

  /journal:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List journal entries
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /personas:
    get:
      operationId: listPersonas
      tags: [personas]
      summary: List all persona forms
      responses:
        "200":
          description: List of persona forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Persona"

  /personas/active:
    patch:
      operationId: setActivePersona
      tags: [personas]
      summary: Switch active persona form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaActivation"
      responses:
        "200":
          description: Updated active persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"

  /beliefs:
    get:
      operationId: listBeliefs
      tags: [beliefs]
      summary: List all beliefs
      responses:
        "200":
          description: List of beliefs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Belief"
    post:
      operationId: createBelief
      tags: [beliefs]
      summary: Create a belief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeliefInput"
      responses:
        "201":
          description: Created belief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Belief"

  /beliefs/{id}:
    patch:
      operationId: updateBelief
      tags: [beliefs]
      summary: Update a belief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeliefUpdate"
      responses:
        "200":
          description: Updated belief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Belief"
    delete:
      operationId: deleteBelief
      tags: [beliefs]
      summary: Delete a belief
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Belief deleted

  /evolution:
    get:
      operationId: listEvolutionLog
      tags: [evolution]
      summary: List evolution log entries
      responses:
        "200":
          description: List of evolution log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvolutionEntry"

  /initiative:
    get:
      operationId: listInitiativeEvents
      tags: [initiative]
      summary: List initiative events
      responses:
        "200":
          description: List of initiative events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InitiativeEvent"
    post:
      operationId: createInitiativeEvent
      tags: [initiative]
      summary: Log an initiative event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeInput"
      responses:
        "201":
          description: Created initiative event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiativeEvent"

  /hiero-code:
    get:
      operationId: listHieroSymbols
      tags: [hiero]
      summary: List all Hiero-Code symbols
      responses:
        "200":
          description: List of Hiero-Code symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HieroSymbol"

  /expressions:
    get:
      operationId: listExpressions
      tags: [expressions]
      summary: List all emotive QUERTY micro-expressions
      responses:
        "200":
          description: List of emotive expressions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expression"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get system statistics and analytics summary
      responses:
        "200":
          description: System analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStats"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /engrams:
    get:
      operationId: listEngrams
      tags: [engrams]
      summary: List all engrams
      responses:
        "200":
          description: List of engrams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engram"

  /engrams/tick:
    post:
      operationId: tickEngrams
      tags: [engrams]
      summary: Run one autonomy tick across all enabled engrams (manual/dev trigger)
      responses:
        "200":
          description: Tick result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngramTickResult"

  /engrams/synthesize:
    post:
      operationId: synthesizeEngram
      tags: [engrams]
      summary: Synthesize a new engram from the processed observation archive plus operator stipulations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngramSynthesisInput"
      responses:
        "201":
          description: The newly created engram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engram"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "502":
          description: Synthesis generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /engrams/state:
    get:
      operationId: getEngramStates
      tags: [engrams]
      summary: Live autonomy state (per-drive pressure, cooldown, backoff) for every engram
      responses:
        "200":
          description: Live state for every engram
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngramLiveState"

  /engrams/{id}:
    get:
      operationId: getEngram
      tags: [engrams]
      summary: Get a single engram
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Engram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engram"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    patch:
      operationId: updateEngramConfig
      tags: [engrams]
      summary: Update an engram's designable processing-environment config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngramConfigInput"
      responses:
        "200":
          description: Updated engram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engram"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /engrams/{id}/activate:
    post:
      operationId: activateEngram
      tags: [engrams]
      summary: Make this engram the active chat engram (exclusive)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated engram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engram"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /engrams/{id}/transmit:
    post:
      operationId: transmitEngram
      tags: [engrams]
      summary: Force the engram to generate one transmission now (bypasses threshold)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Generated transmission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngramTransmission"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "503":
          description: Generation unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /engrams/{id}/transmissions:
    get:
      operationId: listEngramTransmissions
      tags: [engrams]
      summary: List an engram's transmissions (most recent first)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of transmissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngramTransmission"

  /engrams/{id}/transmissions/mark-seen:
    post:
      operationId: markTransmissionsSeen
      tags: [engrams]
      summary: Mark transmissions as seen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkSeenInput"
      responses:
        "200":
          description: Count marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkSeenResult"

  /engrams/{id}/inquiries:
    get:
      operationId: listEngramInquiries
      tags: [engrams]
      summary: List inquiry history for an engram
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngramInquiry"
    post:
      operationId: createEngramInquiry
      tags: [engrams]
      summary: Submit a probe or develop inquiry to an engram
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngramInquiryInput"
      responses:
        "201":
          description: Inquiry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngramInquiry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /engrams/{id}/world-model:
    get:
      operationId: listEngramWorldModel
      tags: [engrams]
      summary: List an engram's world-model entries (most recent first)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of world-model entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorldModelEntry"
    post:
      operationId: createEngramWorldModelEntry
      tags: [engrams]
      summary: Append a new world-model entry for an engram
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldModelInput"
      responses:
        "201":
          description: Created world-model entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldModelEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /engrams/{id}/world-model/{entryId}:
    patch:
      operationId: updateEngramWorldModelEntry
      tags: [engrams]
      summary: Update an entry's content/confidence/scope/source (provenance is immutable)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorldModelPatch"
      responses:
        "200":
          description: Updated world-model entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldModelEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "409":
          description: Provenance change rejected (provenance is immutable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteEngramWorldModelEntry
      tags: [engrams]
      summary: Delete a world-model entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /hub/spaces:
    get:
      operationId: listHubSpaces
      tags: [hub]
      summary: List all Hub spaces (display order)
      responses:
        "200":
          description: List of Hub spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HubSpace"

  /hub/presence:
    get:
      operationId: listHubPresence
      tags: [hub]
      summary: List every engram's current presence in the Hub
      responses:
        "200":
          description: List of engram presence records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngramPresence"

  /hub/presence/{engramId}:
    put:
      operationId: moveEngramPresence
      tags: [hub]
      summary: Move (or place) an engram into a Hub space
      parameters:
        - name: engramId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovePresenceInput"
      responses:
        "200":
          description: Updated presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngramPresence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /hub/activity:
    get:
      operationId: listHubActivity
      tags: [hub]
      summary: List recent Hub activity (most recent first)
      parameters:
        - name: spaceId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent Hub activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HubActivityEntry"

  /hub/controls:
    get:
      operationId: getHubControls
      tags: [hub]
      summary: Get the global autonomy controls (pause, quiet mode)
      responses:
        "200":
          description: Current global controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubControls"
    put:
      operationId: updateHubControls
      tags: [hub]
      summary: Update the global autonomy controls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubControlsInput"
      responses:
        "200":
          description: Updated global controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubControls"

  /messages:
    get:
      operationId: listEngramMessages
      tags: [hub]
      summary: List bus messages (engram-to-engram and human-directed), newest first
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [engram, human]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent bus messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngramMessage"

  /messages/mark-seen:
    post:
      operationId: markEngramMessagesSeen
      tags: [hub]
      summary: Mark human-channel messages as seen by the operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkMessagesSeenInput"
      responses:
        "200":
          description: Count of updated messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkMessagesSeenResult"

  /simulations:
    post:
      operationId: createSimulation
      tags: [simulations]
      summary: Open an operator-directed simulation with a specific scenario premise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationCreateInput"
      responses:
        "201":
          description: The newly opened simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Engram not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "409":
          description: Engram not in chamber, incapable, or already simulating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    get:
      operationId: listSimulations
      tags: [simulations]
      summary: List bounded simulations, newest first
      parameters:
        - name: engramId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [proposed, running, paused, ended]
      responses:
        "200":
          description: Simulations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Simulation"

  /simulations/{id}/steps:
    get:
      operationId: listSimulationSteps
      tags: [simulations]
      summary: List a simulation's ordered steps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ordered simulation steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimulationStep"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /simulations/{id}/control:
    post:
      operationId: controlSimulation
      tags: [simulations]
      summary: Operator control of a simulation (start, pause, resume, end)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationControlInput"
      responses:
        "200":
          description: Updated simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: List uploaded media assets, newest first
      parameters:
        - name: engramId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processing, completed, failed]
      responses:
        "200":
          description: Media assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaAsset"

  /media/{id}:
    get:
      operationId: getMediaAsset
      tags: [media]
      summary: Get one media asset with the world-model observations it produced
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Media asset detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteMediaAsset
      tags: [media]
      summary: Delete a media asset and its bytes (world-model observations are preserved)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMediaResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /media/{id}/retry:
    post:
      operationId: retryMediaAsset
      tags: [media]
      summary: Re-queue a failed media asset for perception
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Re-queued asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "400":
          description: Not retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: List generated artifacts, newest first
      parameters:
        - name: engramId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processing, completed, failed, canceled]
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [pdf, image, video]
      responses:
        "200":
          description: Generated artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngramArtifact"
    post:
      operationId: createArtifact
      tags: [artifacts]
      summary: Queue a new generation job ("create now")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArtifactRequest"
      responses:
        "201":
          description: Queued artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngramArtifact"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Engram not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /artifacts/{id}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: Get one generated artifact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngramArtifact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteArtifact
      tags: [artifacts]
      summary: Delete a generated artifact and its bytes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteArtifactResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /artifacts/{id}/retry:
    post:
      operationId: retryArtifact
      tags: [artifacts]
      summary: Re-queue a failed artifact for generation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Re-queued artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngramArtifact"
        "400":
          description: Not retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

