packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ~19.1.10
  '@types/react-dom': ~19.1.7
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: 0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

packageExtensions:
  react-native-worklets:
    dependencies:
      '@babel/types': ^7.0.0
      '@babel/generator': ^7.0.0
      '@babel/parser': ^7.0.0
      '@babel/traverse': ^7.0.0

onlyBuiltDependencies:
  - '@swc/core'
  - electron
  - esbuild
  - ffmpeg-static
  - msw
  - unrs-resolver

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@electron/get>undici': 7.29.0
  'ajv>fast-uri': 3.1.6
  'browserslist': 4.28.7
  'linkify-it': 5.0.2
  'minimatch@3>brace-expansion': 1.1.18
  'minimatch@5>brace-expansion': 2.1.4
  'minimatch@9>brace-expansion': 2.1.4
  'minimatch@10>brace-expansion': 5.0.9
  'postcss': 8.5.18
  'tar': 7.5.21
  'js-yaml@4': 4.3.1
  'js-yaml@3': 3.15.1
  'nanoid@3': 3.3.18
  'shell-quote': 1.12.0
  'image-size': link:./lib/image-size-patched
  esbuild: 0.27.3
